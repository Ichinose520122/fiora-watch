name: Test and publish Docker image
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watch-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: docker compose --env-file .env.example config --quiet
        env:
          WATCH_SHARED_SECRET: ci-only-not-a-production-secret-0123456789
      - run: docker compose --env-file .env.example -f compose.yaml -f compose.build.yaml config --quiet
        env:
          WATCH_SHARED_SECRET: ci-only-not-a-production-secret-0123456789
      - run: docker build --pull -t fiora-watch:test .
      - name: Verify container Node.js version
        run: |
          docker run --rm fiora-watch:test node -e "if (process.version !== 'v24.22.1') throw new Error(process.version); console.log(process.version)"
      - name: Container health check
        run: |
          docker run -d --name watch-test -p 9300:9300 -e WATCH_SHARED_SECRET=ci-only-not-a-production-secret-0123456789 fiora-watch:test
          for i in $(seq 1 20); do
            if curl --fail http://127.0.0.1:9300/health; then exit 0; fi
            sleep 1
          done
          docker logs watch-test
          exit 1
  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ghcr.io/ichinose520122/fiora-watch:latest
            ghcr.io/ichinose520122/fiora-watch:main
            ghcr.io/ichinose520122/fiora-watch:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Pull and start published image with Compose
        env:
          WATCH_IMAGE: ghcr.io/ichinose520122/fiora-watch@${{ steps.image.outputs.digest }}
          WATCH_SHARED_SECRET: ci-only-not-a-production-secret-0123456789
        run: |
          mkdir -p library
          docker compose --env-file .env.example pull
          docker compose --env-file .env.example run --rm --no-deps watch node -e "if (process.version !== 'v24.22.1') throw new Error(process.version); console.log(process.version)"
          docker compose --env-file .env.example up -d --wait --wait-timeout 90
          curl --fail http://127.0.0.1:9300/health
      - name: Show deployment logs
        if: failure()
        env:
          WATCH_SHARED_SECRET: ci-only-not-a-production-secret-0123456789
        run: docker compose --env-file .env.example logs
      - name: Stop test deployment
        if: always()
        env:
          WATCH_SHARED_SECRET: ci-only-not-a-production-secret-0123456789
        run: docker compose --env-file .env.example down -v
