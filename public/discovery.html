<div id="source-notice" class="notice source-notice" role="status" hidden></div>
<form id="search-form" class="form-block">
  <label for="search">搜索番剧</label>
  <div class="input-row">
    <input id="search" type="search" required maxlength="80" placeholder="输入片名…">
    <button id="search-button" class="primary">搜索</button>
  </div>
</form>
<div id="search-results" class="catalog-grid" aria-live="polite"></div>
<button id="more-results" class="quiet more-results" hidden>查看更多</button>
<div class="source-section">
  <form id="source-form">
    <label for="source">视频链接</label>
    <div class="input-row source-row">
      <input id="source" type="url" required maxlength="4096" placeholder="粘贴视频链接（支持 YouTube、X 等）">
      <button id="inspect" type="button">读取分集</button>
      <button id="load" class="primary" disabled>立即播放</button>
    </div>
    <label id="youtube-link-options" hidden>播放方式
      <select id="youtube-link-delivery">
        <option value="">自动（使用当前设置）</option>
        <option value="proxy">服务器中继</option>
        <option value="direct">浏览器直连（失败时尝试中继）</option>
        <option value="default">恢复跟随全站设置</option>
      </select>
    </label>
  </form>
</div>
<section id="catalog-detail" class="catalog-detail" aria-label="剧集详情" hidden>
  <div class="episode-heading">
    <div>
      <h2 id="catalog-title"></h2>
    </div>
    <span id="catalog-count" class="identity"></span>
  </div>
  <p id="catalog-description"></p>
  <div class="selection-actions selection-top">
    <label for="catalog-group">播放线路</label>
    <select id="catalog-group"></select>
    <span id="batch-controls" hidden>
      <button id="select-all-episodes" type="button">全选本线路</button>
      <button id="clear-episodes" type="button">取消选择</button>
      <span id="batch-count" role="status">已选 0 集</span>
    </span>
  </div>
  <div id="catalog-episodes" class="episode-grid"></div>
  <div class="selection-actions selection-bottom">
    <span id="selected-episode"></span>
    <button id="play-episode" class="primary" data-control disabled>播放当前集</button>
    <button id="download-episode" data-admin hidden>下载当前集</button>
    <button id="download-batch" class="primary" data-admin hidden>下载已选剧集</button>
  </div>
</section>
<div class="current-source">
  <span>正在放映</span>
  <strong id="current-title">未选择</strong>
  <button id="clear" class="quiet" disabled>清空</button>
</div>
