<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiora Watch · 放映室</title><link rel="stylesheet" href="/style.css"><script defer src="/vendor/atom/lottie_svg.min.js"></script><script defer src="/vendor/atom/APlayer.watch.js"></script><script type="module" src="/app.js"></script></head>
<body class="cinema-page">
<header class="topbar"><a class="brand" id="home" href="/"><span class="brand-icon">◐</span> fiora<span class="brand-sub">WATCH</span></a><div class="header-actions"><span id="identity" class="identity"></span><a id="manage" class="quiet" href="/" target="_blank" rel="noopener">片源与下载 ↗</a><button id="logout" class="quiet" hidden>退出</button></div></header>
<main class="cinema-main"><div class="room-heading"><div><span class="eyebrow">PRIVATE CINEMA</span><h1>放映室</h1></div><span id="connection" class="status-pill">等待加入</span></div><div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<div class="cinema-layout"><section class="player-card" aria-label="播放器">
<div id="player-shell" class="player-shell" aria-busy="false">
<div class="screen"><div id="danmaku-layer"></div><span id="delivery-status" class="delivery-status" hidden></span><video id="video" playsinline preload="auto"></video><div id="empty"><span class="empty-icon">▷</span><h2>银幕已就绪</h2><a id="choose-source" href="/" target="_blank" rel="noopener">选择影片 ↗</a></div><div id="player-loading" class="player-loading" role="status" hidden><span class="loading-spinner" aria-hidden="true"></span><span id="loading-text">正在加载影片…</span></div><div id="player-error" class="player-error" role="status" hidden><span id="player-error-text"></span><button id="retry-player" type="button">重新加载</button></div><button id="unmute" class="unmute-overlay" type="button" hidden>点击开启声音</button><button id="join" class="join-overlay" hidden>点击观看 <span aria-hidden="true">▶</span></button></div>
<div class="player-controls"><label class="seek-label"><span class="sr-only">播放进度</span><input id="seek" aria-label="播放进度" type="range" min="0" max="100" value="0" step="0.1" disabled></label><div class="transport"><button id="toggle" class="icon-button" aria-label="播放" disabled>▶</button><span id="time">00:00 / 00:00</span><div class="volume"><label for="volume" class="sr-only">本机音量</label><span aria-hidden="true">♪</span><input id="volume" type="range" min="0" max="1" step="0.05" value="1"></div><div class="player-setting"><button id="quality-button" class="setting-button" aria-haspopup="menu" aria-controls="quality-menu" aria-expanded="false">清晰度</button><div id="quality-menu" class="player-menu" role="menu" aria-label="本机清晰度" hidden><p class="player-menu-heading">画质</p><div id="quality-options"></div><p id="quality-message" class="player-menu-message"></p></div></div><div class="player-setting"><button id="subtitle-button" class="setting-button" aria-haspopup="menu" aria-controls="subtitle-menu" aria-expanded="false">字幕</button><div id="subtitle-menu" class="player-menu" role="menu" aria-label="本机字幕" hidden><p class="player-menu-heading">字幕</p><div id="subtitle-options"></div><p id="subtitle-message" class="player-menu-message"></p></div></div><button id="danmaku-toggle" class="setting-button" type="button" aria-pressed="true">弹幕开</button><button id="fullscreen" class="icon-button" aria-label="全屏" aria-pressed="false">⛶</button></div></div>
</div>
<div class="movie-meta"><div class="movie-mark">NOW<br>SHOWING</div><div><h2 id="title">今晚看什么？</h2><p id="playback-status">等待选择影片</p></div></div>
<section id="episode-panel" class="episode-panel" aria-label="选集" hidden><div class="episode-heading"><h2>选集 <span id="episode-count"></span></h2><div class="episode-navigation"><button id="previous-episode" class="quiet">← 上一集</button><button id="next-episode" class="quiet">下一集 →</button></div></div><div id="episodes" class="episode-grid"></div></section></section>
<aside class="chat-card" aria-label="聊天"><div class="chat-heading"><h2>一起聊聊<span class="chat-dot"></span></h2><span id="chat-status">连接中</span></div><div id="messages" class="messages" aria-live="polite"><div class="chat-empty">这一刻，想说些什么？</div></div><form id="comment-form" class="composer"><label class="sr-only" for="comment">发送评论</label><textarea id="comment" rows="2" maxlength="2048" placeholder="说点什么…" disabled></textarea><div class="composer-bottom"><a id="back-to-fiora" href="#" target="_blank" rel="noopener">Fiora 聊天 ↗</a><button id="send-comment" type="submit" aria-label="发送评论" disabled>↑</button></div></form><p id="chat-error" class="chat-error" role="status" hidden></p></aside></div></main>
</body></html>
