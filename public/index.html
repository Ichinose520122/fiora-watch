<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fiora Watch · 放映室</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/vendor/atom/lottie_svg.min.js"></script>
  <script defer src="/vendor/atom/APlayer.watch.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body class="cinema-page">
  <header class="topbar">
    <a class="brand" id="home" href="/">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="2.5" y="4" width="19" height="16" rx="4.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M10 8.8 15.5 12 10 15.2V8.8Z" fill="currentColor"/>
        </svg>
      </span>
      fiora<span class="brand-sub">WATCH</span>
    </a>
    <div class="header-actions">
      <span id="identity" class="identity"></span>
      <a id="manage" class="quiet nav-pill" href="/" target="_blank" rel="noopener">媒体中心 ↗</a>
      <button id="logout" class="quiet" hidden>退出</button>
    </div>
  </header>
  <main class="cinema-main">
    <div class="room-heading">
      <div>
        <span class="eyebrow">FIORA WATCH / CINEMA</span>
        <h1>一起看<span class="heading-dot">.</span></h1>
      </div>
      <span id="connection" class="status-pill">等待加入</span>
    </div>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <div class="cinema-layout">
      <section class="player-card" aria-label="播放器">
        <div id="player-shell" class="player-shell" aria-busy="false">
          <div class="screen">
            <div id="danmaku-layer"></div>
            <span id="delivery-status" class="delivery-status" hidden></span>
            <video id="video" playsinline preload="auto"></video>
            <div id="empty">
              <span class="empty-icon" aria-hidden="true">
                <svg viewBox="0 0 48 48" fill="none">
                  <rect x="6" y="9" width="36" height="30" rx="7" stroke="currentColor" stroke-width="2"/>
                  <path d="M13 9v30M35 9v30M6 17h7M6 24h7M6 31h7M35 17h7M35 24h7M35 31h7" stroke="currentColor" stroke-width="1.6" opacity="0.4"/>
                  <path d="M21 18.5 30 24l-9 5.5v-11Z" fill="currentColor"/>
                </svg>
              </span>
              <h2>好电影，一起看</h2>
              <a id="choose-source" href="/" target="_blank" rel="noopener">选择影片 ↗</a>
            </div>
            <div id="player-loading" class="player-loading" role="status" hidden>
              <span class="loading-spinner" aria-hidden="true"></span>
              <span id="loading-text">正在加载影片…</span>
            </div>
            <div id="player-error" class="player-error" role="status" hidden>
              <span id="player-error-text"></span>
              <button id="retry-player" type="button">重新加载</button>
            </div>
            <button id="unmute" class="unmute-overlay" type="button" hidden>点击开启声音</button>
            <button id="join" class="join-overlay" hidden>点击观看 <span aria-hidden="true">▶</span></button>
          </div>
          <div class="player-controls">
            <label class="seek-label">
              <span class="sr-only">播放进度</span>
              <input id="seek" aria-label="播放进度" type="range" min="0" max="100" value="0" step="0.1" disabled>
            </label>
            <div class="transport">
              <button id="toggle" class="icon-button" aria-label="播放" disabled>▶</button>
              <span id="time">00:00 / 00:00</span>
              <div class="volume">
                <label for="volume" class="sr-only">本机音量</label>
                <span aria-hidden="true" class="volume-icon">
                  <svg viewBox="0 0 16 16" fill="none">
                    <path d="M3 6.2h2.4L8.8 3.5v9L5.4 9.8H3V6.2Z" fill="currentColor"/>
                    <path d="M11.2 5.5a3.5 3.5 0 0 1 0 5M12.8 3.8a6 6 0 0 1 0 8.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                  </svg>
                </span>
                <input id="volume" type="range" min="0" max="1" step="0.05" value="1">
              </div>
              <div class="player-setting">
                <button id="quality-button" class="setting-button" aria-haspopup="menu" aria-controls="quality-menu" aria-expanded="false">清晰度</button>
                <div id="quality-menu" class="player-menu" role="menu" aria-label="本机清晰度" hidden>
                  <p class="player-menu-heading">画质</p>
                  <div id="quality-options"></div>
                  <p id="quality-message" class="player-menu-message"></p>
                </div>
              </div>
              <div class="player-setting">
                <button id="subtitle-button" class="setting-button" aria-haspopup="menu" aria-controls="subtitle-menu" aria-expanded="false">字幕</button>
                <div id="subtitle-menu" class="player-menu" role="menu" aria-label="本机字幕" hidden>
                  <p class="player-menu-heading">字幕</p>
                  <div id="subtitle-options"></div>
                  <p id="subtitle-message" class="player-menu-message"></p>
                </div>
              </div>
              <button id="danmaku-toggle" class="setting-button" type="button" aria-pressed="true">弹幕开</button>
              <button id="theater" class="icon-button" type="button" aria-label="影院模式" aria-pressed="false" title="影院模式（网页全屏）">
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <rect x="1.75" y="3" width="12.5" height="10" rx="1.8" stroke="currentColor" stroke-width="1.45"/>
                  <path d="M4.2 8h2.6M4.2 8l1.3-1.3M4.2 8l1.3 1.3M11.8 8H9.2m2.6 0-1.3-1.3M11.8 8l-1.3 1.3" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <button id="fullscreen" class="icon-button" aria-label="全屏" aria-pressed="false" title="全屏">
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M2.5 6V3.5a1 1 0 0 1 1-1H6M10 2.5h2.5a1 1 0 0 1 1 1V6M13.5 10v2.5a1 1 0 0 1-1 1H10M6 13.5H3.5a1 1 0 0 1-1-1V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="movie-meta">
          <div class="movie-mark">正在<br>放映</div>
          <div class="movie-meta-body">
            <h2 id="title">等待开场</h2>
            <p id="playback-status">等待选择影片</p>
          </div>
        </div>
        <section id="episode-panel" class="episode-panel" aria-label="选集" hidden>
          <div class="episode-heading">
            <h2>选集 <span id="episode-count"></span></h2>
            <div class="episode-navigation">
              <button id="previous-episode" class="quiet">← 上一集</button>
              <button id="next-episode" class="quiet">下一集 →</button>
            </div>
          </div>
          <div id="episodes" class="episode-grid"></div>
        </section>
      </section>
      <aside class="chat-card" aria-label="聊天">
        <div class="chat-heading">
          <h2>一起聊聊<span class="chat-dot"></span></h2>
          <span id="chat-status">连接中</span>
        </div>
        <div id="messages" class="messages" aria-live="polite">
          <div class="chat-empty">聊聊正在看的故事吧</div>
        </div>
        <form id="comment-form" class="composer">
          <label class="sr-only" for="comment">发送评论</label>
          <textarea id="comment" rows="2" maxlength="2048" placeholder="说点什么…" disabled></textarea>
          <div class="composer-bottom">
            <a id="back-to-fiora" href="#" target="_blank" rel="noopener">Fiora 聊天 ↗</a>
            <button id="send-comment" type="submit" aria-label="发送评论" disabled>
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M8 12.5v-9M4.2 7.2 8 3.5l3.8 3.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </form>
        <p id="chat-error" class="chat-error" role="status" hidden></p>
      </aside>
    </div>
  </main>
</body>
</html>
