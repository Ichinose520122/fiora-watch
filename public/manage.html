<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiora Watch · 片源管理</title><link rel="stylesheet" href="/style.css"><script defer src="/manage.js"></script></head>
<body><header class="topbar"><a class="brand" href="/" id="home"><span class="brand-icon">◐</span> fiora<span class="brand-sub">WATCH</span></a><a id="back" class="quiet" href="/">返回放映室 ↗</a></header>
<main class="management"><div class="room-heading"><div><span class="eyebrow">YOUR COLLECTION</span><h1>片源与下载</h1></div><span id="identity" class="identity"></span></div><div id="notice" class="notice" role="status" hidden></div>
<nav class="tabs" aria-label="媒体管理"><button data-tab="online" class="active">在线片源</button><button data-tab="local">媒体库</button><button data-tab="download" id="download-tab" hidden>下载任务</button></nav>
<section id="online-panel" class="panel"><div class="panel-header"><h2>寻找下一部好片</h2></div><form id="search-form"><label for="search">搜索 girigirilove</label><div class="input-row"><input id="search" type="search" required maxlength="160" placeholder="输入片名…"><button id="search-button" class="primary">搜索影片</button></div></form><div id="search-results" class="catalog-grid" aria-live="polite"></div><button id="more-results" class="quiet more-results" hidden>查看更多</button>
<div class="source-section"><form id="source-form"><label for="source">或粘贴播放页 / 视频地址</label><div class="input-row source-row"><input id="source" type="url" required maxlength="4096" placeholder="https://…"><button id="inspect" type="button">读取分集</button><button id="load" class="primary" disabled>播放此地址</button></div></form></div>
<section id="catalog-detail" class="catalog-detail" aria-label="剧集详情" hidden><div class="episode-heading"><div><span class="eyebrow">EPISODES</span><h2 id="catalog-title"></h2></div><span id="catalog-count" class="identity"></span></div><div id="catalog-episodes" class="episode-grid"></div><div class="selection-actions"><span id="selected-episode"></span><button id="play-episode" class="primary" data-control disabled>播放选中</button><button id="download-episode" data-admin hidden>下载选中</button></div></section>
<div class="current-source"><span>正在放映</span><strong id="current-title">未选择</strong><button id="clear" class="quiet" disabled>清空</button></div></section>
<section id="local-panel" class="panel" hidden><div class="panel-header row"><h2>媒体库</h2><button id="refresh-library" class="quiet">刷新</button></div><div id="library" class="media-grid"></div></section>
<section id="download-panel" class="panel" hidden><div class="panel-header"><h2>提前下载</h2><p id="storage"></p></div><form id="download-form"><label for="download-source">视频地址</label><div class="input-row"><input id="download-source" type="url" required maxlength="4096" placeholder="https://…"><button class="primary">添加任务</button></div></form><div id="jobs" class="job-list"></div></section></main></body></html>
