<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiora Watch · 片源管理</title><link rel="stylesheet" href="/style.css"><script defer src="/manage.js"></script></head>
<body><header class="topbar"><a class="brand" href="/" id="home"><span class="brand-icon">◐</span> fiora<span class="brand-sub">WATCH</span></a><a id="back" class="quiet" href="/">返回放映室 ↗</a></header>
<main class="management"><div class="room-heading"><div><span class="eyebrow">YOUR COLLECTION</span><h1>片源与下载</h1></div><span id="identity" class="identity"></span></div><div id="notice" class="notice" role="status" hidden></div>
<nav class="tabs" aria-label="媒体管理"><button data-tab="online" class="active">在线片源</button><button data-tab="local">媒体库</button><button data-tab="download" id="download-tab" hidden>下载任务</button><button data-tab="bilibili" id="bilibili-tab" hidden>B站账号</button></nav>
<section id="online-panel" class="panel"><div class="panel-header"><h2>寻找下一部好片</h2></div><form id="search-form"><label for="search">搜索 girigirilove</label><div class="input-row"><input id="search" type="search" required maxlength="160" placeholder="输入片名…"><button id="search-button" class="primary">搜索影片</button></div></form><div id="search-results" class="catalog-grid" aria-live="polite"></div><button id="more-results" class="quiet more-results" hidden>查看更多</button>
<div class="source-section"><form id="source-form"><label for="source">或粘贴播放页 / 视频地址</label><div class="input-row source-row"><input id="source" type="url" required maxlength="4096" placeholder="https://…"><button id="inspect" type="button">读取分集</button><button id="load" class="primary" disabled>播放此地址</button></div></form></div>
<section id="catalog-detail" class="catalog-detail" aria-label="剧集详情" hidden><div class="episode-heading"><div><span class="eyebrow">EPISODES</span><h2 id="catalog-title"></h2></div><span id="catalog-count" class="identity"></span></div><p id="catalog-description"></p><div class="selection-actions"><label for="catalog-group">播放线路</label><select id="catalog-group"></select><span id="batch-controls" hidden><button id="select-all-episodes" type="button">全选本线路</button><button id="clear-episodes" type="button">清空勾选</button><span id="batch-count" role="status">已选 0 集</span></span></div><div id="catalog-episodes" class="episode-grid"></div><div class="selection-actions"><span id="selected-episode"></span><button id="play-episode" class="primary" data-control disabled>播放当前集</button><button id="download-episode" data-admin hidden>下载当前集</button><button id="download-batch" class="primary" data-admin hidden>批量下载勾选剧集</button></div></section>
<div class="current-source"><span>正在放映</span><strong id="current-title">未选择</strong><button id="clear" class="quiet" disabled>清空</button></div></section>
<section id="local-panel" class="panel" hidden><div class="panel-header row"><h2>媒体库</h2><button id="refresh-library" class="quiet">刷新</button></div><div id="library" class="media-grid"></div></section>
<section id="download-panel" class="panel" hidden><div class="panel-header"><h2>提前下载</h2><p id="storage"></p><p id="queue-summary" role="status"></p></div><form id="download-form"><label for="download-source">番剧、播放页或视频直链</label><div class="input-row"><input id="download-source" type="url" required maxlength="4096" placeholder="粘贴番剧地址，读取全季后勾选下载"><button id="add-download" class="primary">解析并添加</button></div></form><div id="jobs" class="job-list"></div></section>
<section id="bilibili-panel" class="panel account-panel" hidden><div class="panel-header"><h2>B站账号</h2><p>影院中的 B站视频使用此账号播放</p></div>
<div class="account-card"><span class="account-mark" aria-hidden="true">B</span><div class="account-details"><div class="account-name-row"><h3 id="bilibili-name">尚未绑定账号</h3><span id="bilibili-vip" class="account-vip" hidden>大会员</span></div><p id="bilibili-status" role="status" aria-live="polite">未连接</p></div><button id="bilibili-refresh" class="quiet">刷新状态</button></div>
<div class="account-actions"><button id="bilibili-login" class="primary">扫码登录</button><button id="bilibili-logout" class="quiet" hidden>解除绑定</button><span id="bilibili-checked" class="account-checked"></span></div>
<div id="bilibili-qr" class="account-qr" hidden><div class="qr-image-frame"><img id="bilibili-qr-image" alt="B站登录二维码" width="196" height="196" hidden></div><div class="qr-info"><span class="eyebrow">BILIBILI</span><h3 id="bilibili-qr-status" role="status" aria-live="polite">等待扫码</h3><button id="bilibili-retry" class="quiet" hidden>重新扫码</button></div></div>
<section id="playback-settings" class="source-section" aria-label="B站播放方式"><h3>播放方式</h3><p>默认由你的浏览器直接加载视频。账号解析仍由影院完成，账号凭据不会发给观看者。来源拒绝直连时自动改用服务器中转，播放器会显示实际方式。保存后，下次选片生效。</p><form id="playback-settings-form"><label for="bilibili-delivery">B站视频传输</label><div class="input-row"><select id="bilibili-delivery"><option value="direct">用户端直连（默认，失败回退）</option><option value="proxy">服务器中转</option></select><button id="save-playback-settings" class="primary">保存播放方式</button></div></form><p id="playback-settings-status" role="status"></p></section>
</section></main></body></html>
