<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fiora Watch · 媒体中心</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/manage.js"></script>
</head>
<body class="management-page">
  <header class="topbar">
    <a class="brand" href="/" id="home">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="2.5" y="4" width="19" height="16" rx="4.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M10 8.8 15.5 12 10 15.2V8.8Z" fill="currentColor"/>
        </svg>
      </span>
      fiora<span class="brand-sub">WATCH</span>
    </a>
    <div class="header-actions">
      <a id="back" class="quiet nav-pill" href="/">返回放映室 ↗</a>
    </div>
  </header>
  <main class="management">
    <div class="room-heading">
      <div>
        <span class="eyebrow">FIORA WATCH / COLLECTION</span>
        <h1>媒体中心<span class="heading-dot">.</span></h1>
      </div>
      <span id="identity" class="identity"></span>
    </div>
    <div id="notice" class="notice" role="status" hidden></div>
    <div class="management-layout">
      <nav class="tabs" aria-label="媒体管理">
        <button data-tab="online" class="active">发现影片</button>
        <button data-tab="local">媒体库</button>
        <button data-tab="download" id="download-tab" hidden>下载任务</button>
        <button data-tab="settings" id="settings-tab" hidden>播放设置</button>
        <button data-tab="bilibili" id="bilibili-tab" hidden>B站账号</button>
      </nav>
      <div class="management-content">
        <section id="online-panel" class="panel">
          <div class="panel-header">
            <h2>想看点什么？</h2>
          </div>
          <form id="search-form" class="form-block">
            <label for="search">搜索番剧</label>
            <div class="input-row">
              <input id="search" type="search" required maxlength="80" placeholder="输入片名…">
              <button id="search-button" class="primary">搜索影片</button>
            </div>
          </form>
          <div id="search-results" class="catalog-grid" aria-live="polite"></div>
          <button id="more-results" class="quiet more-results" hidden>查看更多</button>
          <div class="source-section">
            <form id="source-form">
              <label for="source">已有片源链接</label>
              <div class="input-row source-row">
                <input id="source" type="url" required maxlength="4096" placeholder="https://…">
                <button id="inspect" type="button">读取分集</button>
                <button id="load" class="primary" disabled>立即播放</button>
              </div>
            </form>
          </div>
          <section id="catalog-detail" class="catalog-detail" aria-label="剧集详情" hidden>
            <div class="episode-heading">
              <div>
                <span class="eyebrow">EPISODES</span>
                <h2 id="catalog-title"></h2>
              </div>
              <span id="catalog-count" class="identity"></span>
            </div>
            <p id="catalog-description"></p>
            <div class="selection-actions selection-top">
              <label for="catalog-group">播放线路</label>
              <select id="catalog-group"></select>
              <span id="batch-controls" hidden>
                <button id="select-all-episodes" type="button">全选本线路</button>
                <button id="clear-episodes" type="button">取消选择</button>
                <span id="batch-count" role="status">已选 0 集</span>
              </span>
            </div>
            <div id="catalog-episodes" class="episode-grid"></div>
            <div class="selection-actions selection-bottom">
              <span id="selected-episode"></span>
              <button id="play-episode" class="primary" data-control disabled>播放当前集</button>
              <button id="download-episode" data-admin hidden>下载当前集</button>
              <button id="download-batch" class="primary" data-admin hidden>下载已选剧集</button>
            </div>
          </section>
          <div class="current-source">
            <span>正在放映</span>
            <strong id="current-title">未选择</strong>
            <button id="clear" class="quiet" disabled>清空</button>
          </div>
        </section>
        <section id="local-panel" class="panel" hidden>
          <div class="panel-header row">
            <h2>媒体库</h2>
            <button id="refresh-library" class="quiet">刷新</button>
          </div>
          <label class="sr-only" for="library-filter">搜索媒体库</label>
          <input id="library-filter" class="library-search" type="search" placeholder="按片名或番剧筛选…">
          <div id="library-toolbar" class="library-toolbar" hidden>
            <span id="library-selection-count" role="status">已选 0 项</span>
            <div class="toolbar-actions">
              <button id="library-select-all" type="button">全选当前结果</button>
              <button id="library-clear-selection" type="button">取消选择</button>
              <button id="library-remove-selected" class="danger" type="button" disabled>删除所选</button>
            </div>
          </div>
          <div id="library" class="media-grid"></div>
        </section>
        <section id="download-panel" class="panel" hidden>
          <div class="panel-header download-header">
            <h2>下载任务</h2>
            <p id="storage"></p>
            <p id="queue-summary" role="status"></p>
          </div>
          <form id="download-form" class="form-block">
            <label for="download-source">添加片源链接</label>
            <div class="input-row">
              <input id="download-source" type="url" required maxlength="4096" placeholder="粘贴番剧、播放页或视频链接">
              <button id="add-download" class="primary">添加下载</button>
            </div>
          </form>
          <div id="jobs" class="job-list"></div>
        </section>
        <section id="settings-panel" class="panel settings-panel" hidden>
          <div class="panel-header">
            <h2>播放设置</h2>
          </div>
          <section id="playback-settings" aria-label="播放方式">
            <form id="playback-settings-form">
              <label for="playback-delivery">在线视频加载方式</label>
              <div class="input-row">
                <select id="playback-delivery">
                  <option value="direct">浏览器直连</option>
                  <option value="proxy">服务器中继</option>
                </select>
                <button id="save-playback-settings" class="primary">保存</button>
              </div>
            </form>
            <p class="field-note">适用于所有在线片源，下次选片生效。</p>
            <p id="playback-settings-status" role="status"></p>
          </section>
        </section>
        <section id="bilibili-panel" class="panel account-panel" hidden>
          <div class="panel-header">
            <h2>B站账号</h2>
          </div>
          <div class="account-card">
            <span class="account-mark" aria-hidden="true">
              <svg viewBox="0 0 28 28" fill="none">
                <path d="M9 4.5 12 8M19 4.5 16 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <rect x="4" y="8" width="20" height="14" rx="4" stroke="currentColor" stroke-width="2"/>
                <path d="M10.5 13v3M17.5 13v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </span>
            <div class="account-details">
              <div class="account-name-row">
                <h3 id="bilibili-name">尚未绑定账号</h3>
                <span id="bilibili-vip" class="account-vip" hidden>大会员</span>
              </div>
              <p id="bilibili-status" role="status" aria-live="polite">未连接</p>
            </div>
            <button id="bilibili-refresh" class="quiet">刷新状态</button>
          </div>
          <div class="account-actions">
            <button id="bilibili-login" class="primary">扫码登录</button>
            <button id="bilibili-logout" class="quiet" hidden>解除绑定</button>
            <span id="bilibili-checked" class="account-checked"></span>
          </div>
          <div id="bilibili-qr" class="account-qr" hidden>
            <div class="qr-image-frame">
              <img id="bilibili-qr-image" alt="B站登录二维码" width="196" height="196" hidden>
            </div>
            <div class="qr-info">
              <span class="eyebrow">BILIBILI</span>
              <h3 id="bilibili-qr-status" role="status" aria-live="polite">等待扫码</h3>
              <button id="bilibili-retry" class="quiet" hidden>重新扫码</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
